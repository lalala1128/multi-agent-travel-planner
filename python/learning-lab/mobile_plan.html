<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>定制旅行行程</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f0;color:#173b34;font:16px/1.65 Inter,"Microsoft YaHei",sans-serif}
main{max-width:46rem;margin:auto;padding:clamp(1.2rem,5vw,3rem);background:white;border-top:5px solid #267364}
h1,h2,h3,p{margin:.35rem 0 .8rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.8rem}
input,textarea,button{font:inherit}input,textarea{display:block;width:100%;padding:.55rem;border:1px solid #819e94;border-radius:.4rem}
textarea{min-height:6rem}label{display:block;margin:.4rem 0}button{background:#195b50;color:white;border:0;border-radius:.4rem;padding:.7rem 1.2rem}
button:disabled{opacity:.55}.candidate{padding:.8rem;margin:.7rem 0;background:#f3f6f0;border-radius:.5rem}.stop{padding:.7rem 0;border-bottom:1px solid #ddd}small{display:block;color:#49665d}article{padding:1rem 0;border-top:1px solid #c7dad1}a{color:#185f52}[hidden]{display:none!important}
</style></head><body><main><h1>定制旅行行程</h1><p>查阅在线旅行资料，按你的需求生成每天的安排。行程与预算用于出行参考。</p>
<form id="planner"><div class="grid">
<label>目的地<input name="city" placeholder="例如：厦门" maxlength="80" required></label>
<label>出发城市（选填）<input name="departure" maxlength="80"></label>
<label>出发日期（选填）<input name="start_date" type="date"></label>
<label>天数<input name="days" type="number" min="1" max="7" value="3" required></label>
<label>人数<input name="people" type="number" min="1" max="12" value="2" required></label>
<label>全团预算（元，选填）<input name="budget_cny" type="number" min=".01" step=".01"></label></div>
<label>你想怎么玩？<textarea name="needs" maxlength="800" placeholder="例如：带父母，想吃当地小吃，下午预留休息时间，尽量少走路。" required></textarea></label>
<label {{key_visibility}}>服务访问密钥<input name="access_key" type="password" autocomplete="off"></label>
<button>联网生成行程</button><p role="status" id="status"></p><a id="reopen" href="" hidden>重新打开表单</a></form><section id="result"></section></main>
<script>
const form=document.querySelector('#planner'), statusLine=document.querySelector('#status'), result=document.querySelector('#result');
function add(parent,tag,text){const node=document.createElement(tag);node.textContent=text;parent.append(node);return node}
const reopen = document.querySelector('#reopen');
const draftKey = 'travel.mobile.form.v1';
const fields = ['city','departure','start_date','days','people','budget_cny','needs'];
try {
  const draft = JSON.parse(sessionStorage.getItem(draftKey));
  for (const field of fields) {
    if (typeof draft?.[field] === 'string') form.elements[field].value = draft[field];
  }
} catch {}
function saveDraft() {
  const draft = Object.fromEntries(fields.map(field => [field, form.elements[field].value]));
  try { sessionStorage.setItem(draftKey, JSON.stringify(draft)); } catch {}
}
form.addEventListener('input', saveDraft);
function responseError(r) {
  if (r.type === 'opaqueredirect' || r.status === 401) {
    reopen.hidden = false;
    return '入口要求重新验证。请在本标签页重新打开表单，完成邮箱验证后再提交。';
  }
  if (r.status === 403) return '入口拒绝了提交（HTTP 403）。请确认使用获准邮箱，在系统浏览器中打开预览。';
  if (r.status === 404 || r.status === 405) return '这个地址无法提交行程（HTTP '+r.status+'）。请从最新的手机规划链接进入。';
  if (r.status === 429) return '当前请求过多（HTTP 429），请稍后再试。';
  if (r.status >= 500) return '规划服务或预览隧道暂不可用（HTTP '+r.status+'）。请稍后重试。';
  return '入口返回了意外的页面（HTTP '+r.status+'）。请从最新的手机规划链接进入。';
}
form.onsubmit=async event=>{
  event.preventDefault();const btn=form.querySelector('button');btn.disabled=true;
  saveDraft();reopen.hidden=true;
  result.replaceChildren();statusLine.textContent='正在联网查资料并生成计划，请保持页面打开…';
  const req=Object.fromEntries(new FormData(form));const key=req.access_key;delete req.access_key;
  if(!req.budget_cny)delete req.budget_cny;if(!req.start_date)delete req.start_date;
  const headers={'Content-Type':'application/json','Accept':'application/json'};if(key)headers['X-API-Key']=key;
  try{
    let r;
    try {
      r=await fetch('/mobile/plan',{method:'POST',headers,body:JSON.stringify(req),credentials:'same-origin',redirect:'manual',cache:'no-store'});
    } catch {
      throw Error('无法连接到预览入口。请检查网络后重试。');
    }
    if(!r.headers.get('content-type')?.includes('application/json'))throw Error(responseError(r));
    const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'请检查填写的内容。');
    add(result,'h2',req.city+' · '+req.days+' 日行程');
    function sourceLinks(parent, ids) {
      for (const id of new Set(ids)) {
        const source = data.sources.find(item => item.id === id);
        if (!source) continue;
        const link = add(parent,'a',' ['+id+'] '+source.title+' ');
        link.href=source.url;link.target='_blank';link.rel='noopener noreferrer';
      }
    }
    function money(amount,currency='CNY') {
      return amount == null ? '待查询' : new Intl.NumberFormat('zh-CN',{style:'currency',currency}).format(amount);
    }
    add(result,'h3','酒店候选');
    const hotels=data.candidates.hotels;
    add(result,'p',hotels.message+(hotels.environment?' · '+hotels.environment:''));
    for(const item of hotels.offers || []) {
      const card=add(result,'div','');card.className='candidate';
      add(card,'h3',item.hotel_name);
      add(card,'p',item.check_in+' 入住 → '+item.check_out+' 离店 · '+item.nights+' 晚');
      add(card,'p',item.room_name+' · '+item.rooms+' 间 · 每间 '+item.adults_per_room+' 位成人 · '+item.board);
      add(card,'p','整段供应商净报价 '+item.total_price+' '+item.currency+' · 每间每晚均价 '+item.per_room_night+' '+item.currency);
      add(card,'p',item.total_cny==null?'人民币折算暂不可用':'人民币参考 '+item.total_cny+' 元'+(item.rate_date?' · 汇率日 '+item.rate_date:''));
      add(card,'small','查询时间 '+new Date(item.quoted_at).toLocaleString()+' · 最终售价及税费需核价');
    }
    add(result,'h3','航班候选');
    const flights=data.candidates.flights;
    add(result,'p',flights.message+(flights.environment==='test'?' · 测试报价':''));
    for(const item of flights.items || []) {
      const card=add(result,'div','');card.className='candidate';
      add(card,'strong',item.people+' 人往返 '+item.total_price+' '+item.currency);
      for(const [i,part] of item.slices.entries()) {
        add(card,'p',i===0?'去程':'返程');
        for(const segment of part) add(card,'p',segment.airline+' '+segment.flight+' · '+segment.origin+' '+segment.departure+' → '+segment.destination+' '+segment.arrival);
      }
    }
    add(result,'h3','景点候选');
    for(const item of data.plan.attractions) {
      const card=add(result,'div','');card.className='candidate';
      add(card,'h3',item.id+' · '+item.name);
      add(card,'p',item.address+' · 建议游览 '+item.suggested_minutes+' 分钟');
      add(card,'p','成人参考门票 '+money(item.price_cny)+' · '+item.price_basis);
      add(card,'p','开放时间　'+item.opening_hours);
      add(card,'p','预约　'+item.booking);
      sourceLinks(card,item.sources);
    }
    for(const [i,day] of data.plan.days.entries()) {
      const article=add(result,'article','');add(article,'h3','第 '+(i+1)+' 天'+(day.date?' · '+day.date:'')+' · 建议时间表');
      for(const stop of day.stops) {
        const row=add(article,'div','');row.className='stop';
        add(row,'strong',stop.start+'–'+stop.end+'　'+stop.place);
        add(row,'p',stop.activity);
        add(row,'small','到达方式　'+stop.transport);
        add(row,'small','全团本时段参考费用　'+money(stop.estimated_cost_cny)+(stop.attraction_id?' · 对应候选 '+stop.attraction_id:' · 预算估算'));
      }
      sourceLinks(article,day.sources);
    }
    add(result,'h3','预算安排');
    if(data.budget) {
      add(result,'p','已列活动、餐饮与市内交通估算 '+money(data.budget.activity_and_local_estimate_cny)+' / 全团');
      add(result,'p','候选酒店最低参考 '+money(data.budget.lowest_hotel_reference_cny)+' / 整段住宿');
      add(result,'p',data.budget.message);
    }
    add(result,'p',data.plan.budget_note);
    add(result,'h3','出行前确认');add(result,'p',data.plan.verify_before_departure);
    statusLine.textContent='资料检索于 '+new Date(data.retrieved_at).toLocaleString();result.scrollIntoView({behavior:'smooth'});
  }catch(e){statusLine.textContent=e.message}finally{btn.disabled=false}
};
</script></body></html>
