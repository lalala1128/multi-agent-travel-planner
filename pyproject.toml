[project]
name = "multi-agent-travel-planner"
version = "0.2.0"
description = "LangGraph travel workflow with Qdrant RAG, Redis tasks and replayable SSE"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "langgraph>=1,<2",
  "qdrant-client>=1.14,<2", "redis>=5,<9", "pydantic>=2,<3",
  "httpx>=0.27,<1", "python-dotenv>=1,<2", "loguru>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "fakeredis[lua]>=2,<3", "ruff>=0.9,<1"]
ui = ["streamlit>=1.35,<2"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
