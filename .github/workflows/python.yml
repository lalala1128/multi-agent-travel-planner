name: Python checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check python/services python/orchestrator/graph.py python/api/app.py python/tests/test_enhancements.py
      - run: uv run pytest -q
