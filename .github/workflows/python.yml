name: Python checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check python/services python/orchestrator/graph.py python/api/app.py python/tests/test_enhancements.py
      - run: uv run pytest -q

  learning-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/learning-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: >-
          python -m pytest
          test_answer_agent.py test_answer_retry.py test_document_loader.py
          test_reranker.py test_ingest_manifest.py test_knowledge_cache.py
          test_rate_limiter.py test_quote_providers.py test_metrics.py test_embedding_settings.py
          test_tasks.py -q
